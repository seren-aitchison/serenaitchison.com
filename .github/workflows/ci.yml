name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Content and structure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies: the site is plain ES modules and the tests use node:test.
      - name: Run tests
        run: node --test tests/*.mjs

  browser:
    name: Pages load without errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve and crawl
        run: |
          python3 -m http.server 8080 &
          sleep 2
          node .github/crawl.mjs
