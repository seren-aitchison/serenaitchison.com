name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Content and structure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No dependencies: the site is plain ES modules and the tests use node:test.
      - name: Run tests
        run: node --test tests/*.mjs

  browser:
    name: Pages load without errors
    # Pinned: ubuntu-latest moved to 26.04 in Oct 2026 and Playwright 1.56 cannot
    # install Chromium there. Revisit when a Playwright release supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve and crawl
        run: |
          python3 -m http.server 8080 &
          sleep 2
          node .github/crawl.mjs

  analysis:
    name: CRC analysis tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analysis/crc-plasticity
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Synthetic fixtures only: the real matrices are 2.5 GB and live on GEO.
      # scripts/download_data.py verifies them by checksum for a full local run.
      - name: Install
        run: pip install -r requirements.lock

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Package imports cleanly without data present
        run: python -c "import crc, crc.stats, crc.scoring, crc.figures; print(crc.__version__)"
