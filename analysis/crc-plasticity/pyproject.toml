[project]
name = "crc-plasticity"
version = "0.2.0"
description = "Regional heterogeneity of a fetal-like epithelial programme in colorectal cancer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "h5py>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
